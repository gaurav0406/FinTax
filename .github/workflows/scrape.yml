name: Scrape Financial News

on:
  schedule:
    - cron: '0 */6 * * *' # This runs the script automatically every 6 hours
  workflow_dispatch: # This allows you to click a button to run it manually

permissions:
  contents: write # Allows the bot to commit the new JSON file

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Adjust this if you need a specific Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add the libraries your scraper needs below (e.g., requests, beautifulsoup4)
          pip install requests beautifulsoup4 feedparser google-generativeai gtts supabase

      - name: Run Scraper
        run: |
          python financial_news_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_news.json
          git commit -m "Auto-update live_news.json" || exit 0
          git push
