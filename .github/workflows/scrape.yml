name: Scrape Financial News

on:
  schedule:
    - cron: '0 * * * *' # This runs the script automatically every 6 hours
  workflow_dispatch: # This allows you to click a button to run it manually

permissions:
  contents: write # Allows the bot to commit the new JSON file

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser google-generativeai gTTS supabase

      - name: Create or Touch live_news.json
        run: |
          if [ ! -f live_news.json ]; then echo "[]" > live_news.json; fi

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python financial_news_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_news.json
          git commit -m "Auto-update live_news.json" || echo "No changes to commit"
          git push
